<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>四则运算计算器</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #f2f6ff, #fef6ff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .calculator {
      width: min(520px, 100%);
      background: #ffffff;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 18px 40px rgba(31, 41, 55, 0.15);
    }

    h1 {
      margin: 0 0 16px;
      font-size: 24px;
      color: #1f2937;
    }

    p {
      margin: 0 0 24px;
      color: #6b7280;
      line-height: 1.5;
    }

    .inputs {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      margin-bottom: 16px;
    }

    label {
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
      display: block;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      font-size: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .operations {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 0;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(79, 70, 229, 0.15);
    }

    .add {
      background: #4f46e5;
      color: #ffffff;
    }

    .subtract {
      background: #0ea5e9;
      color: #ffffff;
    }

    .multiply {
      background: #10b981;
      color: #ffffff;
    }

    .divide {
      background: #f97316;
      color: #ffffff;
    }

    .result {
      background: #f9fafb;
      border-radius: 16px;
      padding: 18px;
      border: 1px dashed #d1d5db;
    }

    .result-title {
      font-weight: 600;
      color: #111827;
      margin-bottom: 8px;
    }

    .result-value {
      font-size: 24px;
      color: #4f46e5;
      font-weight: 700;
    }

    .hint {
      margin-top: 12px;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <main class="calculator">
    <h1>四则运算计算器</h1>
    <p>输入两个数字后点击运算按钮即可自动计算加、减、乘、除的结果。</p>

    <section class="inputs">
      <div>
        <label for="numberA">数字 A</label>
        <input type="number" id="numberA" placeholder="请输入第一个数字" />
      </div>
      <div>
        <label for="numberB">数字 B</label>
        <input type="number" id="numberB" placeholder="请输入第二个数字" />
      </div>
    </section>

    <section class="operations">
      <button class="add" data-operation="add">加法 +</button>
      <button class="subtract" data-operation="subtract">减法 -</button>
      <button class="multiply" data-operation="multiply">乘法 ×</button>
      <button class="divide" data-operation="divide">除法 ÷</button>
    </section>

    <section class="result" aria-live="polite">
      <div class="result-title">计算结果</div>
      <div class="result-value" id="resultValue">等待输入</div>
      <div class="hint" id="resultHint">请选择任意运算按钮。</div>
    </section>
  </main>

  <script>
    const numberA = document.getElementById("numberA");
    const numberB = document.getElementById("numberB");
    const resultValue = document.getElementById("resultValue");
    const resultHint = document.getElementById("resultHint");
    const buttons = document.querySelectorAll("[data-operation]");

    const formatNumber = (value) => {
      if (!Number.isFinite(value)) {
        return "计算结果无效";
      }
      return Number.isInteger(value) ? value.toString() : value.toFixed(6);
    };

    const getNumbers = () => {
      const a = Number(numberA.value);
      const b = Number(numberB.value);
      return { a, b };
    };

    const showResult = (operationLabel, value) => {
      resultValue.textContent = formatNumber(value);
      resultHint.textContent = `${operationLabel}完成。`;
    };

    const showWarning = (message) => {
      resultValue.textContent = "请检查输入";
      resultHint.textContent = message;
    };

    const calculate = (operation) => {
      const { a, b } = getNumbers();

      if (Number.isNaN(a) || Number.isNaN(b)) {
        showWarning("请输入两个有效数字。");
        return;
      }

      switch (operation) {
        case "add":
          showResult("加法", a + b);
          break;
        case "subtract":
          showResult("减法", a - b);
          break;
        case "multiply":
          showResult("乘法", a * b);
          break;
        case "divide":
          if (b === 0) {
            showWarning("除数不能为 0。");
            return;
          }
          showResult("除法", a / b);
          break;
        default:
          showWarning("请选择运算方式。");
      }
    };

    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        calculate(button.dataset.operation);
      });
    });
  </script>
</body>
</html>
